name: countdown_app
description: "DazeToGo - The only countdown app with shareable live links."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  appwrite: ^13.1.1
  crypto: ^3.0.5
  timezone: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.1
  logger: ^2.5.0
  flutter_spinkit: ^5.2.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2

dependency_overrides:
  flutter_web_auth_2: ^4.1.0
  flutter_web_auth_2_platform_interface: ^4.1.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/themes/
    - assets/fonts/

  fonts:
    - family: PPObjectSans
      fonts:
        - asset: assets/fonts/PPObjectSans-Regular.otf
          weight: 400
        - asset: assets/fonts/PPObjectSans-Medium.otf
          weight: 500
        - asset: assets/fonts/PPObjectSans-Bold.otf
          weight: 700
