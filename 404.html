<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Countdown App</title>
  <script>
    // Redirect 404 to index.html with query preserved
    sessionStorage.setItem('redirect', location.href);
    location.replace(location.origin + location.pathname.split('/').slice(0, -1).join('/') + '/index.html');
  </script>
</head>
<body></body>
</html>
